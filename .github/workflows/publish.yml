# https://docs.npmjs.com/trusted-publishers#step-2-configure-your-cicd-workflow
name: Test, Lint, Release and Publish

on:
  push:
    branches:
      - main
      - 'release/[0-9]+.x'

# https://docs.npmjs.com/trusted-publishers
permissions:
  id-token: write    # Required for OIDC
  contents: write    # Required for the release and tag creation

jobs:
  main:
    name: Release and publish Node package
    runs-on: github-hosted-static-ip
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install and test
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          registry-url: 'https://registry.npmjs.org'
      - run: npm install
      - run: npm run build
      - run: npm run lint
      - run: npm test

      - name: Extract version
        id: extract_version
        uses: Saionaro/extract-package-version@v1.4.0

      - name: See if version changed
        env:
          VERSION: ${{ steps.extract_version.outputs.version }}
        run: |
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "VERSION_CHANGED=false" >> "$GITHUB_ENV"
          else
            echo "VERSION_CHANGED=true" >> "$GITHUB_ENV"
          fi

      - name: Create tag
        uses: rickstaa/action-create-tag@v1
        if: env.VERSION_CHANGED == 'true'
        with:
          tag: "v${{ steps.extract_version.outputs.version }}"

      - name: Create release
        if: env.VERSION_CHANGED == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: 'v${{ steps.extract_version.outputs.version }}'
          generate_release_notes: true
          make_latest: ${{ github.ref_name == 'main' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish new version
        if: env.VERSION_CHANGED == 'true'
        env:
          NPM_CONFIG_PROVENANCE: true
        run: |
          if [[ "$GITHUB_REF_NAME" == "main" ]]; then
            DIST_TAG=latest
          else
            MAJOR="${GITHUB_REF_NAME#release/}"
            DIST_TAG="latest-${MAJOR%%.*}"
          fi
          npm publish --access public --verbose --tag "$DIST_TAG"
