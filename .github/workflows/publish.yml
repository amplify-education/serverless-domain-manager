# https://docs.npmjs.com/trusted-publishers#step-2-configure-your-cicd-workflow
name: Test, Lint, Release and Publish

on:
  push:
    branches:
      - main

# https://docs.npmjs.com/trusted-publishers
permissions:
  id-token: write    # Required for OIDC
  contents: write    # Required for the release and tag creation

jobs:
  main:
    name: Release and publish Node package
    runs-on: github-hosted-static-ip
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install and test
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.x
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm test

      - name: Extract version
        id: extract_version
        uses: Saionaro/extract-package-version@a5ea15b23669502732d230f62cabfa92fb137a38 # v1.4.0

      - name: Get latest tag
        id: get_latest_tag
        uses: WyriHaximus/github-action-get-previous-tag@83f26fea93bc7efcbca2eb5591f5eaaf66b8f206 # v2.1.0
        with:
          fallback: 'v0.0.0'

      - name: See if version changed
        run: |
          if [[ "v${{ steps.extract_version.outputs.version }}" == "${{ steps.get_latest_tag.outputs.tag }}" ]]; then
            echo "VERSION_CHANGED=false" >> "$GITHUB_ENV"
          else
            echo "VERSION_CHANGED=true" >> "$GITHUB_ENV"
          fi

      - name: Create tag
        uses: rickstaa/action-create-tag@a1c7777fcb2fee4f19b0f283ba888afa11678b72 # v1.7.2
        if: env.VERSION_CHANGED == 'true'
        with:
          tag: "v${{ steps.extract_version.outputs.version }}"

      - name: Create release
        if: env.VERSION_CHANGED == 'true'
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: 'v${{ steps.extract_version.outputs.version }}'
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish new version
        if: env.VERSION_CHANGED == 'true'
        env:
          NPM_CONFIG_PROVENANCE: true
        run: npm publish --access public --verbose
